name: Auto-approve

# Non-author bot approval so Dan/James can merge their own PRs.
# Vanta still requires: 1 review on default branch + enforce_admins.
# github-actions[bot] != PR author, so GitHub + Vanta both count this.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  approve:
    if: >-
      github.event.pull_request.draft == false
      && github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Approve as github-actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr review "$PR" --repo "$REPO" --approve --body "Auto-approved (non-author bot). Merge when ready — no second human required."
